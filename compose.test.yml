services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: kueria-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_PASSWORD: kueria-test-only
      SCRIPT_DIR: /scripts
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
