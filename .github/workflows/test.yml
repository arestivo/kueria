name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test against PostgreSQL 16 on Node 24
        run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove test containers and volumes
        if: always()
        run: docker compose -f compose.test.yml down --volumes
