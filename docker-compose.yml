services:
  postgres:
    image: postgres:16
    container_name: keria_postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: ./backend
    container_name: keria_backend
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MAX_SESSIONS: ${MAX_SESSIONS:-40}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-2}
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-1000}
      MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-1048576}
      MAX_SQL_BYTES: ${MAX_SQL_BYTES:-65536}
      MAX_STATEMENTS: ${MAX_STATEMENTS:-100}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
